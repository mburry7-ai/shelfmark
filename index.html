<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Shelfmark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
:root{
  --bg:#EAEEF3; --surface:#FFFFFF; --raised:#F5F7FA; --ink:#16213A; --muted:#586277; --line:#D3D9E2;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8; --star:#D99A1E; --danger:#B23A3A; --shelf:#C9CFD9;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#19202D; --raised:#212a3a; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2D374A;
    --accent:#4DB396; --accent-ink:#0C1A15; --accent-soft:#1D3A32; --star:#EBB443; --danger:#E27171; --shelf:#2A3345;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#19202D; --raised:#212a3a; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2D374A;
  --accent:#4DB396; --accent-ink:#0C1A15; --accent-soft:#1D3A32; --star:#EBB443; --danger:#E27171; --shelf:#2A3345;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 96px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.brand h1{font:700 34px/1.05 var(--serif);letter-spacing:-.01em;margin:0}
.brand p{margin:6px 0 0;color:var(--muted);font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.toolbar .field{max-width:260px}

/* The shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:30px 18px}
.book{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;padding:14px 12px 12px 18px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  box-shadow:inset 6px 0 0 rgba(0,0,0,.18), 0 1px 0 var(--shelf), 0 10px 18px -12px rgba(10,20,40,.55);transition:transform .15s}
.book:hover .cover{transform:translateY(-3px)}
.cover .t{font:600 16px/1.2 var(--serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .a{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .rule{position:absolute;left:18px;right:12px;top:50%;border-top:1px solid rgba(255,255,255,.35)}
.meta{font-size:13px;color:var(--muted);line-height:1.35}
.meta .lent{color:var(--ink);font-weight:500}
.stars-sm{color:var(--star);letter-spacing:1px;font-size:12px}

.empty{padding:56px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty h2{font:600 22px/1.3 var(--serif);margin:0 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:42ch}
.notice{font-size:13px;color:var(--muted);margin:-8px 0 16px}

/* Friends */
.friends{display:grid;gap:10px;max-width:640px}
.friend{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:600;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.friend .who{flex:1;min-width:0}
.friend .who b{display:block;font-weight:600}
.friend .who span{font-size:14px;color:var(--muted)}
.picker{position:relative;max-width:640px;margin-bottom:18px}
.menu{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.3);overflow:hidden}
.menu button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:9px 12px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--raised)}
.menu .hint{padding:8px 12px;font-size:13px;color:var(--muted)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px;max-height:88%}}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.cover{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-head h2{font:600 24px/1.2 var(--serif);margin:0}
.close{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.section{margin-top:22px}
.section > label,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:28px;line-height:1;color:var(--line);padding:0 2px}
.stars button.on{color:var(--star)}
textarea.field{min-height:110px;resize:vertical;line-height:1.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.small{font-size:13px;color:var(--muted)}
.detail-top{display:flex;gap:18px}
.detail-top .cover{width:110px;flex:0 0 auto}
.detail-top .cover .t{font-size:14px}
.detail-top h2{font:700 24px/1.2 var(--serif);margin:0 0 4px}
.detail-top .by{color:var(--muted);margin:0 0 8px}
.saved{font-size:13px;color:var(--accent);min-height:1em}

.scan-box{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:320px;width:100%}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-box .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.status-msg{font-size:14px;color:var(--muted);margin:10px 0}
.status-msg.err{color:var(--danger)}
.results{display:grid;gap:8px;margin-top:14px}
.result{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.result .mini{width:34px;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;flex:0 0 auto}
.result .info{flex:1;min-width:0}
.result .info b{display:block;font-family:var(--serif);font-weight:600}
.result .info span{font-size:14px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.hidden{display:none !important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}


.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini{width:40px;flex:0 0 auto;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;position:relative;overflow:hidden;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.mini .t,.mini .a,.mini .rule{display:none}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.auth{max-width:420px;margin:0 auto;padding:12vh 20px 60px}
.wordmark{font:700 44px/1 var(--serif);letter-spacing:-.015em;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 28px;max-width:36ch}
.auth-form{display:grid;gap:14px}
.auth-form .btn{justify-content:center;padding:11px}
.acct{width:40px;height:40px;border-radius:50%;border:0;color:#fff;font-weight:600;font-size:16px}
.friends-page{display:grid;gap:30px;max-width:680px}
.friends-page h3{font:600 20px/1.3 var(--serif);margin:0 0 10px}
.status-msg.ok{color:var(--accent)}
.holder{margin:0 0 10px;font-weight:500}
.history{margin-top:14px;display:grid;gap:2px}
select.field.inline{width:auto;padding:5px 10px;font-size:14px}
.danger-zone{border-top:1px solid var(--line);padding-top:18px}
.result.top{align-items:flex-start}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:1px 7px;margin-top:4px}
.shared-review{margin:6px 0 0;font-size:14px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px}
.friend .btn{flex:0 0 auto}
.friend .who span{display:block}
.friend .who .count{color:var(--ink)}
.friend .who .stars-sm{color:var(--star)}
.tag.muted{background:var(--raised);color:var(--muted)}
.toolbar-right{flex:0 1 auto}
.toolbar .holder-filter{max-width:220px;width:auto}
.result.top > .btn{align-self:center}
.friend-head{margin-bottom:18px}
.friend-head h2{font:600 26px/1.2 var(--serif);margin:6px 0 2px}
.back{padding-left:0}
.stars-lg{color:var(--star);font-size:22px;letter-spacing:2px}
.reviews{display:grid;gap:14px}
.rev{display:flex;gap:10px;align-items:flex-start}
.avatar.sm{width:30px;height:30px;font-size:13px}
.rev-body{flex:1;min-width:0}
.rev-head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.rev-text{margin:4px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.avg{margin:0 0 12px;font-size:14px;color:var(--muted)}
.recs{margin-bottom:28px}
.recs h3{font:600 20px/1.3 var(--serif);margin:0 0 10px}
.friend.rec{flex-wrap:wrap;align-items:flex-start}
.friend.rec .who{flex-basis:calc(100% - 56px)}
.rec-actions{margin-left:52px}
.rec-note{font-size:14px;color:var(--ink) !important;border-left:2px solid var(--accent);padding-left:10px;margin-top:6px}
.rec-from{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:16px;font-size:14px}
.rec-from .rev-text{margin:4px 0 0}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.steps{padding-left:22px;margin:0 0 12px}
.steps li{margin-bottom:6px}
.checks{display:grid;gap:8px;margin-bottom:8px}
.check{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.import-sum{font-weight:600;margin:0 0 12px}
.ask.muted-ask{background:var(--raised);margin:14px 0 0}
.howto{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.howto summary{cursor:pointer;font-weight:600}
.howto .steps{margin-top:10px}
.section > label.check{display:flex;font-weight:400;font-size:inherit;margin:0}
.ask{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
@media (max-width:520px){.friend:has(.btn){flex-wrap:wrap}.friend:has(.btn) .who{flex-basis:calc(100% - 56px)}}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:30vh 20px;color:#586277;font-family:system-ui,sans-serif">Opening Shelfmark…</p></div>
<script>
/* ================= Settings ================= */
const SUPABASE_URL = 'https://xoeojsxjespynzspqaxs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A2aUP4tAhUrwAiT0U-czFA_qkiR4SyW';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const SPINES = ['#2E4A7D','#7A2E3B','#2F6B5A','#8A5A1F','#4B3B78','#355F7A','#6B3F5E','#3E5B2F','#9A4A2A','#26475A'];
function spine(t){ let x=0; for (const c of (t||'?')) x=(x*31+c.charCodeAt(0))>>>0; return SPINES[x%SPINES.length]; }
const STATUS = {want:'Want to read', reading:'Reading', read:'Read', dnf:"Didn't finish"};
function toast(msg){ const t=h('div',{class:'toast',role:'status',text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2800); }
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '';
const parseYear = s => { const m = String(s||'').match(/\d{4}/); return m ? +m[0] : null; };
function isbn10to13(s){ const c='978'+s.slice(0,9); let sum=0; for(let i=0;i<12;i++) sum+=+c[i]*(i%2?3:1); return c+((10-sum%10)%10); }
function normalizeIsbn(raw){
  const s = String(raw||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if (/^97[89]\d{10}$/.test(s)) return s;
  if (/^\d{9}[\dX]$/.test(s)) return isbn10to13(s);
  return null;
}
async function run(query, failMsg){
  const { data, error } = await query;
  if (error){ console.error(error); toast(failMsg || 'Something went wrong. Try again.'); throw error; }
  return data;
}

/* ================= State ================= */
const S = { user:null, books:[], contacts:[], friendships:[], profiles:{}, borrowed:[], requests:[], shelfCounts:{}, loaded:false,
            view:'library', filter:'all', q:'', holder:'' };
const me = () => S.user && S.user.id;
const myName = () => (S.profiles[me()]||{}).display_name || 'You';
const openLoan = b => (b.loans||[]).find(l=>!l.returned_at);
function loanName(l){
  if (!l) return null;
  if (l.borrower_id) return (S.profiles[l.borrower_id]||{}).display_name || l.borrower_name || 'A friend';
  if (l.contact_id){ const c = S.contacts.find(x=>x.id===l.contact_id); if (c) return c.name; }
  return l.borrower_name || 'Someone';
}
const loanKey = l => !l ? '' : l.borrower_id ? 'u:'+l.borrower_id : l.contact_id ? 'c:'+l.contact_id : 'n:'+(l.borrower_name||'');
const incomingRequests = () => S.requests.filter(r=>r.status==='pending' && r.owner_id===me());
const outgoingRequests = () => S.requests.filter(r=>r.requester_id===me());
const newRecs = () => (S.recs||[]).filter(r=>r.recipient_id===me() && r.status==='new');
const sentRecs = () => (S.recs||[]).filter(r=>r.sender_id===me());
const inTransfers = () => (S.transfers||[]).filter(t=>t.to_id===me() && t.status==='pending');
const outTransfers = () => (S.transfers||[]).filter(t=>t.from_id===me());
const pendingTransferFor = bookId => (S.transfers||[]).find(t=>t.from_id===me() && t.status==='pending' && t.book_id===bookId);
function friendsList(){
  return S.friendships.filter(f=>f.status==='accepted')
    .map(f=>{ const id = f.requester===me() ? f.addressee : f.requester; return { id, fid:f.id, name:(S.profiles[id]||{}).display_name || 'A friend' }; })
    .sort((a,b)=>a.name.localeCompare(b.name));
}

async function loadAll(){
  try{
    const [books, contacts, friendships, profiles, borrowed] = await Promise.all([
      run(sb.from('user_books').select('*, loans(id,borrower_id,contact_id,borrower_name,lent_at,returned_at)').order('added_at',{ascending:false}), "Couldn't load your library."),
      run(sb.from('contacts').select('*').order('name'), "Couldn't load your contacts."),
      run(sb.from('friendships').select('*'), "Couldn't load your friends."),
      run(sb.from('profiles').select('id,display_name'), "Couldn't load your friends."),
      run(sb.rpc('borrowed_books'), "Couldn't load borrowed books.")
    ]);
    Object.assign(S, { books, contacts, friendships, borrowed, loaded:true, profiles:Object.fromEntries(profiles.map(p=>[p.id,p])) });
  }catch{ S.loaded = true; }
  // Borrow requests and shelf counts come from database update 1.
  const [req, counts] = await Promise.all([sb.rpc('my_book_requests'), sb.rpc('friend_shelf_counts')]);
  if (req.error || counts.error){
    console.error(req.error || counts.error);
    if (!S.warnedUpdate){ S.warnedUpdate = true; toast('Borrow requests aren’t set up yet. Run update-1-borrow-requests.sql in Supabase.'); }
  } else {
    S.requests = req.data || [];
    S.shelfCounts = Object.fromEntries((counts.data||[]).map(c=>[c.friend_id, Number(c.book_count)]));
  }
  // Borrowed-book reviews come from database update 2.
  const hist = await sb.rpc('my_borrow_history');
  if (hist.error){ console.error(hist.error); S.history = null;
    if (!S.warnedUpdate2){ S.warnedUpdate2 = true; toast('Shared reviews aren’t set up yet. Run update-2-shared-reviews.sql in Supabase.'); } }
  else S.history = hist.data || [];
  // Recommendations come from database update 3.
  const recs = await sb.rpc('my_recommendations');
  if (recs.error){ console.error(recs.error); S.recs = null;
    if (!S.warnedUpdate3){ S.warnedUpdate3 = true; toast('Recommendations aren’t set up yet. Run update-3-recommendations.sql in Supabase.'); } }
  else S.recs = recs.data || [];
  // "This book belongs to a friend" comes from database update 4.
  const tr = await sb.rpc('my_transfers');
  if (tr.error){ console.error(tr.error); S.transfers = null;
    if (!S.warnedUpdate4){ S.warnedUpdate4 = true; toast('Book ownership changes aren’t set up yet. Run update-4-ownership.sql in Supabase.'); } }
  else S.transfers = tr.data || [];
  render();
}

/* ================= Sign in ================= */
function authView(){
  let mode = 'signin';
  const msg = h('p',{class:'status-msg'});
  const box = h('div');
  const draw = () => {
    const signup = mode==='signup';
    const form = h('form',{class:'auth-form',onsubmit:async e=>{
      e.preventDefault();
      const v = n => form.querySelector(`[name="${n}"]`).value.trim();
      const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      msg.className='status-msg'; msg.textContent = signup ? 'Creating your account…' : 'Signing in…';
      try{
        if (signup){
          if (!v('name')){ msg.className='status-msg err'; msg.textContent='Enter your name so friends can recognize you.'; return; }
          const { data, error } = await sb.auth.signUp({ email:v('email'), password:form.querySelector('[name=password]').value, options:{ data:{ display_name:v('name') } } });
          if (error) throw error;
          if (!data.session){ msg.textContent='Account created. Check your email for a confirmation link, then sign in.'; mode='signin'; }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email:v('email'), password:form.querySelector('[name=password]').value });
          if (error) throw error;
        }
      }catch(err){
        msg.className='status-msg err';
        const m = String(err.message||'');
        msg.textContent = /invalid login/i.test(m) ? 'That email and password don’t match. Check them and try again.'
          : /already registered/i.test(m) ? 'There’s already an account with that email. Sign in instead.'
          : /password/i.test(m) ? 'Choose a password with at least 6 characters.'
          : /email/i.test(m) ? 'Enter a valid email address.' : m || 'Something went wrong. Try again.';
      }finally{ btn.disabled = false; }
    }},
      signup ? h('div',{}, h('label',{class:'lbl',for:'a_name'},'Your name'), h('input',{class:'field',id:'a_name',name:'name',autocomplete:'name',required:true,maxlength:60})) : null,
      h('div',{}, h('label',{class:'lbl',for:'a_email'},'Email'), h('input',{class:'field',id:'a_email',name:'email',type:'email',autocomplete:'email',required:true})),
      h('div',{}, h('label',{class:'lbl',for:'a_pw'},'Password'), h('input',{class:'field',id:'a_pw',name:'password',type:'password',minlength:6,autocomplete:signup?'new-password':'current-password',required:true})),
      h('button',{class:'btn primary',type:'submit'}, signup ? 'Create account' : 'Sign in'));
    box.replaceChildren(
      h('div',{class:'seg',role:'tablist',style:'margin-bottom:18px'},
        h('button',{role:'tab','aria-selected':!signup,onclick:()=>{mode='signin';msg.textContent='';draw();}},'Sign in'),
        h('button',{role:'tab','aria-selected':signup,onclick:()=>{mode='signup';msg.textContent='';draw();}},'Create account')),
      form, msg);
  };
  draw();
  return h('div',{class:'auth'},
    h('h1',{class:'wordmark',text:'Shelfmark'}),
    h('p',{class:'lede',text:'Keep track of the books you own, what you thought of them, and who borrowed them.'}),
    box);
}

/* ================= Main render ================= */
function render(){
  const app = $('#app');
  if (!S.user){ app.replaceChildren(authView()); return; }
  const focusedId = document.activeElement && document.activeElement.id;
  const caret = document.activeElement && document.activeElement.selectionStart;
  const lent = S.books.filter(openLoan).length;
  const incoming = S.friendships.filter(f=>f.status==='pending' && f.addressee===me()).length + incomingRequests().length + inTransfers().length;
  app.replaceChildren(h('div',{class:'wrap'},
    h('header',{class:'top'},
      h('div',{class:'brand'}, h('h1',{text:'Shelfmark'}),
        h('p',{text: !S.loaded ? 'Opening your library…' : S.books.length ? `${S.books.length} book${S.books.length===1?'':'s'} on your shelf${lent?`, ${lent} lent out`:''}` : 'A home for every book you own'})),
      h('div',{class:'row'},
        h('button',{class:'btn primary',onclick:()=>openAdd('scan')},'+ Add a book'),
        h('button',{class:'acct',onclick:openAccount,'aria-label':'Your account',style:`background:${spine(myName())}`,text:(myName()[0]||'?').toUpperCase()}))),
    h('nav',{class:'tabs',role:'tablist'},
      [['library', newRecs().length ? `Library (${newRecs().length})` : 'Library'],['friends', incoming ? `Friends (${incoming})` : 'Friends']].map(([k,l])=>
        h('button',{role:'tab','aria-selected':S.view===k || (k==='friends' && S.view==='friend'),onclick:()=>{S.view=k;S.friend=null;render();}},l))),
    h('main',{}, S.view==='library' ? libraryView() : S.view==='friend' && S.friend ? friendShelfView() : friendsView())));
  if (focusedId){ const el=document.getElementById(focusedId); if(el){ el.focus(); try{el.setSelectionRange(caret,caret);}catch{} } }
}

function coverEl(b, cls='cover'){
  const el = h('div',{class:cls,style:`background:${spine(b.title)}`},
    h('div',{class:'t',text:b.title||'Untitled'}), h('div',{class:'rule'}), h('div',{class:'a',text:b.author||''}));
  if (b.cover_url){
    const img = h('img',{src:b.cover_url,alt:'',loading:'lazy',referrerpolicy:'no-referrer'});
    img.onload = () => { if (img.naturalWidth < 10) img.remove(); else el.classList.add('has-img'); };
    img.onerror = () => img.remove();
    el.append(img);
  }
  return el;
}

function recsStrip(){
  const list = newRecs();
  if (!list.length) return null;
  return h('section',{class:'recs'}, h('h3',{},'Recommended for you'),
    h('div',{class:'friends'}, list.map(r=>h('div',{class:'friend rec'},
      coverEl(r,'mini'),
      h('div',{class:'who'}, h('b',{text:r.title}),
        h('span',{text:[r.author, `from ${r.sender_name}, ${fmtDate(r.created_at)}`].filter(Boolean).join(' · ')}),
        r.note ? h('p',{class:'rev-text rec-note',text:r.note}) : null),
      h('div',{class:'row rec-actions'},
        h('button',{class:'btn primary',onclick:e=>acceptRec(r,e.currentTarget)},'Add to Want to read'),
        h('button',{class:'btn ghost',onclick:async e=>{ e.currentTarget.disabled=true;
          await run(sb.rpc('respond_recommendation',{p_id:r.id,p_status:'dismissed'}),"Couldn't update that.").catch(()=>{}); loadAll(); }},'Not for me'))))));
}
async function acceptRec(r, btn){
  btn.disabled = true;
  try{
    let book = S.books.find(b=>(r.isbn && b.isbn===r.isbn) || (b.title.toLowerCase().trim()===r.title.toLowerCase().trim() && (b.author||'').toLowerCase().trim()===(r.author||'').toLowerCase().trim()));
    if (!book) book = await run(sb.from('user_books').insert({ title:r.title, author:r.author, isbn:r.isbn, cover_url:r.cover_url, year:r.year, pages:r.pages, status:'want' }).select('id').single(), "Couldn't add that book.");
    await run(sb.rpc('respond_recommendation',{p_id:r.id, p_status:'added', p_user_book:book.id}), "Couldn't update that recommendation.");
    toast(`Added “${r.title}” to Want to read`); loadAll();
  }catch{ btn.disabled = false; }
}

function libraryView(){
  if (!S.loaded) return h('p',{class:'small',text:'Loading…'});
  const all = S.books;
  const strip = recsStrip();
  if (!all.length) return h('div',{}, strip, h('div',{class:'empty'},
    h('h2',{text:'Your shelf is empty'}),
    h('p',{text:'Scan the barcode on the back of a book, or search by title, to add your first one.'}),
    h('button',{class:'btn primary',onclick:()=>openAdd('scan')},'Scan a barcode'),' ',
    h('button',{class:'btn',onclick:()=>openAdd('search')},'Search by title'),
    h('p',{class:'small',style:'margin:16px 0 0'},'Use Goodreads or StoryGraph? ', h('button',{class:'linkish',onclick:openImport},'Import your library'))));
  const counts = {all:all.length, lent:0};
  all.forEach(b=>{ counts[b.status]=(counts[b.status]||0)+1; if(openLoan(b)) counts.lent++; });
  const filters = [['all','All'],['reading','Reading'],['want','Want to read'],['read','Read'],['dnf',"Didn't finish"],['lent','Lent out']].filter(([k])=>k==='all'||counts[k]);
  if (!filters.some(([k])=>k===S.filter)) S.filter='all';
  const holders = new Map();
  all.forEach(b=>{ const l = openLoan(b); if (!l) return; const k = loanKey(l); const e = holders.get(k) || {name:loanName(l), n:0}; e.n++; holders.set(k, e); });
  if (S.holder && S.holder!=='shelf' && !holders.has(S.holder)) S.holder = '';
  const holderSel = holders.size ? h('select',{class:'field holder-filter','aria-label':'Who has it',onchange:e=>{S.holder=e.target.value;render();}},
    h('option',{value:'',text:'Who has it: all books',selected:!S.holder}),
    h('option',{value:'shelf',text:`On my shelf (${all.length - counts.lent})`,selected:S.holder==='shelf'}),
    [...holders.entries()].sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,v])=>h('option',{value:k,text:`With ${v.name} (${v.n})`,selected:S.holder===k}))) : null;
  const q = S.q.trim().toLowerCase();
  const list = all.filter(b=>{
    if (S.filter==='lent' ? !openLoan(b) : S.filter!=='all' && b.status!==S.filter) return false;
    if (S.holder==='shelf' && openLoan(b)) return false;
    if (S.holder && S.holder!=='shelf' && loanKey(openLoan(b))!==S.holder) return false;
    return !q || (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q);
  });
  return h('div',{}, strip,
    h('div',{class:'toolbar'},
      h('div',{class:'chips'}, filters.map(([k,l])=>h('button',{class:'chip','aria-pressed':S.filter===k,onclick:()=>{S.filter=k;render();}},l,h('span',{class:'n',text:counts[k]})))),
      h('div',{class:'row toolbar-right'}, holderSel,
        h('input',{class:'field',id:'libSearch',type:'search',placeholder:'Filter by title or author',value:S.q,oninput:e=>{S.q=e.target.value;render();}}))),
    list.length ? h('div',{class:'shelf'}, list.map(b=>{
      const who = loanName(openLoan(b));
      const asks = incomingRequests().filter(r=>r.book_id===b.id);
      return h('button',{class:'book',onclick:()=>openDetail(b.id),'aria-label':`${b.title}${b.author?' by '+b.author:''}`},
        coverEl(b),
        h('div',{class:'meta'}, h('div',{text:STATUS[b.status]}),
          b.rating ? h('div',{class:'stars-sm',text:'★'.repeat(b.rating)}) : null,
          who ? h('div',{class:'lent',text:`With ${who}`}) : null,
          asks.length ? h('div',{class:'tag',text: asks.length===1 ? `${asks[0].requester_name} asked to borrow` : `${asks.length} borrow requests`}) : null,
          pendingTransferFor(b.id) ? h('div',{class:'tag muted',text:`Checking with ${pendingTransferFor(b.id).to_name}`}) : null));
    })) : h('p',{class:'small',text:'No books match that filter.'}));
}

/* ================= Friends ================= */
function friendsView(){
  if (!S.loaded) return h('p',{class:'small',text:'Loading…'});
  const friends = friendsList();
  const incoming = S.friendships.filter(f=>f.status==='pending' && f.addressee===me());
  const outgoing = S.friendships.filter(f=>f.status==='pending' && f.requester===me());
  const name = id => (S.profiles[id]||{}).display_name || 'Someone';
  const avatar = n => h('div',{class:'avatar',style:`background:${spine(n)}`,text:(n[0]||'?').toUpperCase()});

  const emailIn = h('input',{class:'field',id:'friendEmail',type:'email',placeholder:'Their email address','aria-label':'Friend’s email address'});
  const addMsg = h('p',{class:'status-msg'});
  const addForm = h('form',{class:'row',onsubmit:async e=>{
    e.preventDefault(); const email = emailIn.value.trim(); if(!email) return;
    addMsg.className='status-msg'; addMsg.textContent='Sending…';
    try{
      const r = await run(sb.rpc('send_friend_request',{p_email:email}), "Couldn't send that request.");
      const copy = { sent:'Request sent. They’ll see it the next time they open Shelfmark.', accepted:'They’d already asked you, so you’re now friends.',
        already_sent:'You’ve already sent them a request.', already_friends:'You’re already friends.',
        not_found:'No one has signed up with that email yet. Send them the link to this site, then try again once they’ve made an account.',
        self:'That’s your own email.' }[r] || 'Done.';
      addMsg.className = ['sent','accepted'].includes(r) ? 'status-msg ok' : 'status-msg err'; addMsg.textContent = copy;
      if (['sent','accepted'].includes(r)){ emailIn.value=''; await loadAll(); }
    }catch{ addMsg.textContent=''; }
  }}, h('div',{style:'flex:1;min-width:200px'},emailIn), h('button',{class:'btn primary',type:'submit'},'Send request'));

  const holding = id => S.books.filter(b=>{ const l=openLoan(b); return l && l.borrower_id===id; });
  const inReq = incomingRequests(), outReq = outgoingRequests();
  const reqStatus = { pending:'Waiting for a reply', approved:'Approved', declined:'Declined' };
  const contactHolding = id => S.books.filter(b=>{ const l=openLoan(b); return l && l.contact_id===id; });

  return h('div',{class:'friends-page'},
    h('section',{}, h('h3',{},'Add a friend'),
      h('p',{class:'small',style:'margin-top:0'},'Friends can see your shelf and your reviews. You can make any review private.'), addForm, addMsg),
    incoming.length ? h('section',{}, h('h3',{},'Friend requests'), h('div',{class:'friends'}, incoming.map(f=>h('div',{class:'friend'}, avatar(name(f.requester)),
      h('div',{class:'who'}, h('b',{text:name(f.requester)}), h('span',{text:'Wants to be friends'})),
      h('button',{class:'btn primary',onclick:async()=>{ await run(sb.rpc('accept_friend_request',{p_id:f.id}),"Couldn't accept that request."); loadAll(); }},'Accept'),
      h('button',{class:'btn ghost',onclick:async()=>{ await run(sb.from('friendships').delete().eq('id',f.id),"Couldn't decline that request."); loadAll(); }},'Decline'))))) : null,
    inReq.length ? h('section',{}, h('h3',{},'Borrow requests'), h('div',{class:'friends'}, inReq.map(r=>h('div',{class:'friend'},
      coverEl(r,'mini'),
      h('div',{class:'who'}, h('b',{text:r.title}), h('span',{text:`${r.requester_name} asked on ${fmtDate(r.created_at)}`})),
      h('button',{class:'btn primary',onclick:()=>respondRequest(r,true)},'Approve'),
      h('button',{class:'btn ghost',onclick:()=>respondRequest(r,false)},'Decline'))))) : null,
    transferSections()[0],
    h('section',{}, h('h3',{},'Your friends'),
      friends.length ? h('div',{class:'friends'}, friends.map(fr=>{ const has = holding(fr.id);
        return h('div',{class:'friend'}, avatar(fr.name),
          h('div',{class:'who'}, h('b',{text:fr.name}),
            h('span',{class:'count',text: S.shelfCounts[fr.id]!=null ? `${S.shelfCounts[fr.id]||0} book${S.shelfCounts[fr.id]===1?'':'s'} on their shelf` : ''}),
            h('span',{text: has.length ? `Has ${has.length} of yours: ${has.map(b=>b.title).join(', ')}` : 'Has none of your books'})),
          h('button',{class:'btn',onclick:()=>openFriendShelf(fr)},'View shelf'),
          h('button',{class:'btn ghost',onclick:async()=>{ if(!confirm(`Remove ${fr.name} as a friend? You’ll stop seeing each other’s shelves.`)) return;
            await run(sb.from('friendships').delete().eq('id',fr.fid),"Couldn't remove that friend."); loadAll(); }},'Remove'));
      })) : h('p',{class:'small',text:'No friends yet. Send a request by email above.'})),
    outgoing.length ? h('section',{}, h('h3',{},'Waiting for a reply'), h('div',{class:'friends'}, outgoing.map(f=>h('div',{class:'friend'}, avatar(name(f.addressee)),
      h('div',{class:'who'}, h('b',{text:name(f.addressee)}), h('span',{text:`Sent ${fmtDate(f.created_at)}`})),
      h('button',{class:'btn ghost',onclick:async()=>{ await run(sb.from('friendships').delete().eq('id',f.id),"Couldn't cancel that request."); loadAll(); }},'Cancel'))))) : null,
    transferSections()[1],
    sentRecs().length ? h('section',{}, h('h3',{},'Recommendations you’ve sent'), h('div',{class:'friends'}, sentRecs().map(r=>h('div',{class:'friend'},
      coverEl(r,'mini'),
      h('div',{class:'who'}, h('b',{text:r.title}),
        h('span',{text: r.status==='added' ? `${r.recipient_name} added it to their list` : `Sent to ${r.recipient_name}, ${fmtDate(r.created_at)}`}),
        r.note ? h('p',{class:'rev-text rec-note',text:r.note}) : null),
      r.status!=='added' ? h('button',{class:'btn ghost',onclick:async e=>{ if(!confirm(`Take back your recommendation of “${r.title}” to ${r.recipient_name}?`)) return; e.currentTarget.disabled=true;
        await run(sb.rpc('unsend_recommendation',{p_id:r.id}),"Couldn't take that back.").catch(()=>{}); loadAll(); }},'Take back') : null)))) : null,
    outReq.length ? h('section',{}, h('h3',{},'Books you asked to borrow'), h('div',{class:'friends'}, outReq.map(r=>h('div',{class:'friend'},
      coverEl(r,'mini'),
      h('div',{class:'who'}, h('b',{text:r.title}),
        h('span',{text:`From ${r.owner_name}: ${reqStatus[r.status]}${r.responded_at?' '+fmtDate(r.responded_at):''}`})),
      r.status==='pending' ? h('button',{class:'btn ghost',onclick:async()=>{ await run(sb.rpc('cancel_book_request',{p_id:r.id}),"Couldn't cancel that request."); toast('Request cancelled'); loadAll(); }},'Cancel') : null)))) : null,
    ...borrowSections(),
    h('section',{}, h('h3',{},'People without an account'),
      h('p',{class:'small',style:'margin-top:0'},'Names you’ve lent books to who aren’t on Shelfmark. Add new ones from a book’s “Who has it” section.'),
      S.contacts.length ? h('div',{class:'friends'}, S.contacts.map(c=>{ const has = contactHolding(c.id);
        return h('div',{class:'friend'}, avatar(c.name),
          h('div',{class:'who'}, h('b',{text:c.name}), h('span',{text: has.length ? `Has ${has.map(b=>b.title).join(', ')}` : 'Has none of your books'})),
          h('button',{class:'btn ghost',onclick:async()=>{ if(!confirm(`Remove ${c.name}? Past loans will keep their name.`)) return;
            await run(sb.from('contacts').delete().eq('id',c.id),"Couldn't remove that name."); loadAll(); }},'Remove'));
      })) : h('p',{class:'small',text:'None yet.'})));
}

function borrowSections(){
  // Without update 2, show the simple list with no review buttons.
  if (!S.history) return [S.borrowed.length ? h('section',{}, h('h3',{},'Books you’re borrowing'), h('div',{class:'friends'}, S.borrowed.map(b=>h('div',{class:'friend'},
    coverEl(b,'mini'), h('div',{class:'who'}, h('b',{text:b.title}), h('span',{text:`From ${b.owner_name}, since ${fmtDate(b.lent_at)}`})))))) : null];
  const row = (b, line) => h('div',{class:'friend'}, coverEl(b,'mini'),
    h('div',{class:'who'}, h('b',{text:b.title}), h('span',{text:line}),
      b.my_rating ? h('span',{class:'stars-sm',text:'★'.repeat(b.my_rating)}) : null),
    h('button',{class:'btn',onclick:()=>openBorrowReview(b)}, b.my_rating || b.my_review ? 'Edit review' : 'Review'));
  const now = S.history.filter(b=>b.still_have), before = S.history.filter(b=>!b.still_have);
  return [
    now.length ? h('section',{}, h('h3',{},'Books you’re borrowing'), h('div',{class:'friends'}, now.map(b=>row(b, `From ${b.owner_name}, since ${fmtDate(b.last_lent_at)}`)))) : null,
    before.length ? h('section',{}, h('h3',{},'Books you’ve borrowed before'), h('div',{class:'friends'}, before.map(b=>row(b, `From ${b.owner_name}, returned`)))) : null
  ];
}

/* Stacked reviews: what you and your friends think of a book */
function reviewsSection(bookId, { excludeMe=false, title='What friends think' } = {}){
  const box = h('div',{class:'section'}, h('span',{class:'lbl'}, title), h('p',{class:'small',style:'margin:0',text:'Loading…'}));
  (async()=>{
    const { data, error } = await sb.rpc('book_reviews',{p_book:bookId});
    if (error){ box.lastChild.textContent = error.code==='PGRST202' ? 'Run update-2-shared-reviews.sql in Supabase to see friends’ reviews.' : 'Couldn’t load reviews.'; return; }
    const all = data || [];
    const rated = all.filter(r=>r.rating>0);
    const shown = all.filter(r=>!(excludeMe && r.is_me));
    const avg = rated.length ? (rated.reduce((a,r)=>a+r.rating,0)/rated.length) : 0;
    box.replaceChildren(...[
      h('span',{class:'lbl'}, title),
      rated.length > 1 ? h('p',{class:'avg'}, h('span',{class:'stars-sm',text:'★'}), ` ${avg.toFixed(1)} average from ${rated.length} ratings`) : null,
      shown.length ? h('div',{class:'reviews'}, shown.map(r=>h('div',{class:'rev'},
        h('div',{class:'avatar sm',style:`background:${spine(r.reviewer_name)}`,text:(r.reviewer_name[0]||'?').toUpperCase()}),
        h('div',{class:'rev-body'},
          h('div',{class:'rev-head'}, h('b',{text: r.is_me ? 'You' : r.reviewer_name}),
            r.source==='borrowed' ? h('span',{class:'small',text:'borrowed a copy'}) : null,
            r.rating ? h('span',{class:'stars-sm',text:'★'.repeat(r.rating)}) : null),
          r.review ? h('p',{class:'rev-text',text:r.review}) : h('p',{class:'small',style:'margin:2px 0 0',text:'Rated it, no written review.'}),
          h('span',{class:'small',text:fmtDate(r.updated_at)})))))
        : h('p',{class:'small',style:'margin:0',text: excludeMe ? 'None of your friends have reviewed this yet.' : 'No reviews yet.'})
    ].filter(Boolean));
  })();
  return box;
}

function openBorrowReview(b){
  let rating = b.my_rating || 0;
  const stars = h('div',{class:'stars',role:'group','aria-label':'Rating'});
  const drawStars = () => stars.replaceChildren(...[1,2,3,4,5].map(n=>h('button',{type:'button',class:n<=rating?'on':'','aria-label':`${n} star${n>1?'s':''}`,
    onclick:()=>{ rating = rating===n ? 0 : n; drawStars(); }},'★')));
  drawStars();
  const review = h('textarea',{class:'field',id:'borrowReviewBox',placeholder:'What did you think?'}); review.value = b.my_review || '';
  const vis = h('select',{class:'field inline','aria-label':'Who can see your review'},
    h('option',{value:'friends',text:'My friends',selected:b.my_visibility!=='private'}),
    h('option',{value:'private',text:'Only me',selected:b.my_visibility==='private'}));
  const msg = h('span',{class:'saved'});
  const saveBtn = h('button',{class:'btn primary',onclick:async()=>{
    saveBtn.disabled = true;
    try{
      const res = await run(sb.rpc('save_borrow_review',{p_book:b.book_id, p_rating:rating, p_review:review.value, p_visibility:vis.value}),"Your review didn't save. Try again.");
      if (res==='saved'){ Object.assign(b,{my_rating:rating, my_review:review.value, my_visibility:vis.value}); msg.textContent='Review saved'; setTimeout(()=>msg.textContent='',1800);
        reviews.replaceWith(reviews = reviewsSection(b.book_id,{excludeMe:true})); render(); }
      else toast('You can only review books you’ve borrowed.');
    }catch{} finally{ saveBtn.disabled = false; }
  }},'Save review');
  let reviews = reviewsSection(b.book_id,{excludeMe:true});
  openSheet('', h('div',{},
    h('div',{class:'detail-top'}, coverEl(b),
      h('div',{}, h('h2',{text:b.title}), h('p',{class:'by',text:b.author?`by ${b.author}`:'Author unknown'}),

async function respondTransfer(t, accept, status, btn){

function openTransfer(book){
  const friends = friendsList();
  if (!friends.length){ openSheet('Whose book is this?', h('p',{class:'small',text:'Add the owner as a friend first. Then you can mark this as their book.'})); return; }
  let chosen = null;
  const picks = h('div',{class:'chips',role:'radiogroup','aria-label':'Owner'});
  const msg = h('p',{class:'status-msg'});
  const send = h('button',{class:'btn primary',disabled:true});
  const draw = () => {
    picks.replaceChildren(...friends.map(f=>h('button',{type:'button',class:'chip',role:'radio','aria-pressed':chosen===f.id,'aria-checked':chosen===f.id,
      onclick:()=>{ chosen = f.id; draw(); }}, chosen===f.id ? `✓ ${f.name}` : f.name)));
    const f = friends.find(x=>x.id===chosen);
    send.textContent = f ? `Ask ${f.name} to confirm` : 'Choose the owner';
    send.disabled = !f;
  };
  send.onclick = async () => {
    const f = friends.find(x=>x.id===chosen); if (!f) return;
    send.disabled = true;
    try{
      const res = await run(sb.rpc('propose_transfer',{p_book:book.id, p_to:f.id}),"Couldn't send that.");

      msg.className='status-msg err';
      msg.textContent = { already_sent:'You’ve already asked someone about this book.', lent_out:'You’ve marked this book as lent to someone. Mark it returned first.',
        not_friends:`You’re not friends with ${f.name} on Shelfmark.`, not_found:'That book isn’t on your shelf anymore.' }[res] || 'Something went wrong.';
    }catch{}
    send.disabled = false;
  };
  draw();
  openSheet('Whose book is this?', h('div',{},
    h('div',{class:'result',style:'margin-bottom:16px'}, coverEl(book,'mini'), h('div',{class:'info'}, h('b',{text:book.title}), h('span',{text:book.author||''}))),
    h('p',{style:'margin-top:0'},'If this book actually belongs to a friend, they’ll be asked to confirm. Once they do, it moves to their shelf, marked as lent to you, and shows under Books you’re borrowing. Your rating and review stay with it.'),
    h('span',{class:'lbl'},'Who owns it?'), picks,
    h('div',{class:'section'}, send, msg)));
}

/* ================= Recommending ================= */
function openRecommend(book, { preset=[], exclude=null } = {}){
  const friends = friendsList().filter(f=>f.id!==exclude);
  const chosen = new Set(preset.filter(id=>friends.some(f=>f.id===id)));
  if (!friends.length){
    openSheet('Recommend a book', h('p',{class:'small',text: exclude ? 'You don’t have any other friends on Shelfmark to recommend this to yet.' : 'Add a friend first, then you can recommend books to them.'}));
    return;
  }
  const picks = h('div',{class:'chips',role:'group','aria-label':'Send to'});
  const drawPicks = () => picks.replaceChildren(...friends.map(f=>h('button',{type:'button',class:'chip','aria-pressed':chosen.has(f.id),
    onclick:()=>{ chosen.has(f.id) ? chosen.delete(f.id) : chosen.add(f.id); drawPicks(); }}, chosen.has(f.id) ? `✓ ${f.name}` : f.name)));
  drawPicks();
  const note = h('textarea',{class:'field',id:'recNote',maxlength:2000,placeholder:'What did you love about it, or why did it make you think of them?'});
  const msg = h('p',{class:'status-msg'});
  const send = h('button',{class:'btn primary',onclick:async()=>{
    if (!chosen.size){ msg.className='status-msg err'; msg.textContent='Choose at least one friend.'; return; }
    send.disabled = true; msg.className='status-msg'; msg.textContent='Sending…';
    const sent = [], already = [], failed = [];
    for (const id of chosen){
      const f = friends.find(x=>x.id===id);
      const { data, error } = await sb.rpc('recommend_book',{ p_recipient:id, p_title:book.title, p_author:book.author||null, p_isbn:book.isbn||null,
        p_cover_url:book.cover_url||null, p_year:book.year||null, p_pages:book.pages||null, p_note:note.value });
      if (error || !['sent','already_sent'].includes(data)) failed.push(f.name); else (data==='sent' ? sent : already).push(f.name);
    }
    const list = a => a.length<3 ? a.join(' and ') : a.slice(0,-1).join(', ')+', and '+a[a.length-1];
    if (!failed.length){ closeSheet(); toast([sent.length?`Sent to ${list(sent)}.`:'', already.length?`You’d already recommended it to ${list(already)}.`:''].filter(Boolean).join(' ')); loadAll(); }
    else { send.disabled = false; msg.className='status-msg err'; msg.textContent = `Couldn’t send to ${list(failed)}. Try again.`; }
  }},'Send recommendation');
  openSheet('Recommend a book', h('div',{},
    h('div',{class:'result',style:'margin-bottom:18px'}, coverEl(book,'mini'),
      h('div',{class:'info'}, h('b',{text:book.title}), h('span',{text:book.author||''}))),
    h('span',{class:'lbl'},'Send to'), picks,
    h('div',{class:'section'}, h('label',{class:'lbl',for:'recNote'},'Why would they like it? (optional)'), note),
    h('div',{class:'section'}, send, msg)));
}

/* ================= Book detail ================= */
function openDetail(id){
  let book = S.books.find(b=>b.id===id); if (!book) return;
  const save = async (patch, failMsg) => {
    Object.assign(book, patch);
    await run(sb.from('user_books').update(patch).eq('id',book.id), failMsg || "That change didn't save. Try again.");
  };
  const savedEl = h('span',{class:'saved'});

  const statusSeg = h('div',{class:'seg',role:'group','aria-label':'Reading status'});
  const drawStatus = () => statusSeg.replaceChildren(...Object.entries(STATUS).map(([k,l])=>h('button',{'aria-pressed':book.status===k,
    onclick:async()=>{ await save({status:k}); drawStatus(); render(); }},l)));
  drawStatus();

  const stars = h('div',{class:'stars',role:'group','aria-label':'Rating'});
  const drawStars = () => stars.replaceChildren(...[1,2,3,4,5].map(n=>h('button',{class:n<=(book.rating||0)?'on':'','aria-label':`${n} star${n>1?'s':''}`,
    onclick:async()=>{ await save({rating: book.rating===n ? 0 : n}); drawStars(); render(); }},'★')));
  drawStars();

  let t = null;
  const review = h('textarea',{class:'field',id:'reviewBox',placeholder:'What did you think?'});
  review.value = book.review || '';
  const flush = async () => { clearTimeout(t); t=null;
    if ((book.review||'') !== review.value){ try{ await save({review:review.value, reviewed_at:new Date().toISOString()}, "Your review didn't save. Try again."); savedEl.textContent='Review saved'; setTimeout(()=>savedEl.textContent='',1800); }catch{} } };
  review.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(flush, 900); });
  review.addEventListener('blur', flush);
  const vis = h('select',{class:'field inline','aria-label':'Who can see your review'},
    h('option',{value:'friends',text:'My friends',selected:book.review_visibility!=='private'}),
    h('option',{value:'private',text:'Only me',selected:book.review_visibility==='private'}));
  vis.addEventListener('change', async()=>{ await save({review_visibility:vis.value}); toast(vis.value==='friends'?'Friends can now see this review':'This review is now private'); });

  const lendBox = h('div');
  const drawLend = () => {
    const open = openLoan(book), who = loanName(open);
    const friends = friendsList();
    const sel = h('select',{class:'field','aria-label':'Who has this book'},
      h('option',{value:'',text: who ? 'Lend to someone else…' : 'Choose who has it…'}),
      friends.length ? h('optgroup',{label:'Friends'}, friends.map(f=>h('option',{value:'u:'+f.id,text:f.name}))) : null,
      S.contacts.length ? h('optgroup',{label:'Without an account'}, S.contacts.map(c=>h('option',{value:'c:'+c.id,text:c.name}))) : null,
      h('option',{value:'new',text:'Someone new (type a name)…'}));
    const newWrap = h('form',{class:'row hidden',style:'margin-top:10px',onsubmit:async e=>{
      e.preventDefault(); const n = newWrap.querySelector('input').value.trim(); if(!n) return;
      let c = S.contacts.find(x=>x.name.toLowerCase()===n.toLowerCase());
      if (!c){ c = await run(sb.from('contacts').insert({name:n}).select().single(),"Couldn't save that name."); S.contacts.push(c); }
      await lend({contact_id:c.id, borrower_name:c.name});
    }}, h('div',{style:'flex:1;min-width:180px'}, h('input',{class:'field',placeholder:'Their name','aria-label':'Their name',maxlength:80})), h('button',{class:'btn primary',type:'submit'},'Save'));
    sel.addEventListener('change', async ()=>{
      const v = sel.value;
      if (v==='new'){ newWrap.classList.remove('hidden'); newWrap.querySelector('input').focus(); return; }
      newWrap.classList.add('hidden');
      if (v.startsWith('u:')){ const f = friends.find(x=>'u:'+x.id===v); await lend({borrower_id:f.id, borrower_name:f.name}); }
      else if (v.startsWith('c:')){ const c = S.contacts.find(x=>'c:'+x.id===v); await lend({contact_id:c.id, borrower_name:c.name}); }
    });
    const past = (book.loans||[]).filter(l=>l.returned_at).sort((a,b)=>new Date(b.lent_at)-new Date(a.lent_at)).slice(0,5);

/* ================= Goodreads import ================= */
const GR_SHELVES = { 'read':'Read', 'currently-reading':'Currently reading', 'to-read':'Want to read', 'did-not-finish':"Didn't finish", 'paused':'Paused' };
function grStatus(shelf){
  if (shelf==='read') return 'read';
  if (shelf==='currently-reading' || shelf==='paused') return 'reading';
  if (/dnf|did-?not-?finish|abandon|gave-?up|unfinished/i.test(shelf||'')) return 'dnf';
  return 'want';
}
function grText(html){
  const t = document.createElement('textarea');
  t.innerHTML = String(html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>\s*<p>/gi,'\n\n').replace(/<[^>]+>/g,'');
  return t.value.trim();
}
function grDate(s){ const m = String(s||'').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3], 12)).toISOString() : null; }
// StoryGraph exports use different column names. Translate them to Goodreads' names.
function sgToGr(r){
  const rating = parseFloat(r['Star Rating']);
  const owned = String(r['Owned?']||'').trim().toLowerCase();
  return {
    'Title': r['Title'],
    'Author': String(r['Authors']||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,2).join(', '),
    'ISBN13': r['ISBN/UID'], 'ISBN': '',
    'My Rating': isNaN(rating) ? 0 : Math.round(rating),
    'My Review': r['Review'],
    'Exclusive Shelf': String(r['Read Status']||'').trim().toLowerCase() || 'read',
    'Date Added': r['Date Added'], 'Date Read': r['Last Date Read'],
    'Owned Copies': ['yes','true','1'].includes(owned) ? 1 : 0
  };
}
function grRow(r){
  const title = String(r['Title']||'').replace(/\s*\([^()]*#\s*[\d.]+\)\s*$/,'').trim();
  if (!title) return null;
  const isbn = normalizeIsbn(r['ISBN13']) || normalizeIsbn(r['ISBN']);
  const shelf = String(r['Exclusive Shelf']||'').trim() || 'read';
  const year = parseInt(r['Original Publication Year']) || parseInt(r['Year Published']) || null;
  return {
    shelf, owned: parseInt(r['Owned Copies'])>0,
    title: title.slice(0,300), author: String(r['Author']||'').trim() || null,
    isbn, year, pages: parseInt(r['Number of Pages']) || null,
    cover_url: isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : null,
    status: grStatus(shelf), rating: Math.max(0, Math.min(5, parseInt(r['My Rating'])||0)),
    review: grText(r['My Review']).slice(0,20000),
    added_at: grDate(r['Date Added']), read_at: grDate(r['Date Read'])
  };
}

function openImport(){
  const body = h('div');
  const fileIn = h('input',{type:'file',accept:'.csv,text/csv',class:'hidden',onchange:e=>{ const f = e.target.files[0]; e.target.value=''; if (f) parseFile(f); }});
  const msg = h('p',{class:'status-msg'});
  let source = 'Goodreads';
  function start(){
    body.replaceChildren(
      h('p',{style:'margin-top:0'},'Bring your books, ratings, and reviews into Shelfmark. First, download your library:'),
      h('details',{class:'howto',open:true}, h('summary',{},'From Goodreads'),
        h('ol',{class:'steps'},
          h('li',{},'On the Goodreads website, open ', h('b',{},'My Books'), '.'),
          h('li',{},'In the left sidebar, under Tools, click ', h('b',{},'Import and export'), '.'),
          h('li',{},'Click ', h('b',{},'Export Library'), '. When the link appears (it can take a minute), download the file.')),
        h('p',{class:'small'},'The Goodreads app can’t do this, so use a web browser. On a phone, choose “Desktop site” in your browser menu.')),
      h('details',{class:'howto'}, h('summary',{},'From StoryGraph'),
        h('ol',{class:'steps'},
          h('li',{},'On StoryGraph, tap your profile picture and choose ', h('b',{},'Manage Account'), '.'),
          h('li',{},'Find ', h('b',{},'Export StoryGraph Library'), ' and start the export.'),
          h('li',{},'When it’s ready, download the .csv file.')),
        h('p',{class:'small'},'StoryGraph’s half- and quarter-star ratings are rounded to the nearest whole star.')),
      h('div',{class:'row',style:'margin-top:14px'}, h('button',{class:'btn primary',onclick:()=>fileIn.click()},'Choose the file'), fileIn), msg);
  }
  function parseFile(file){
    msg.className='status-msg'; msg.textContent='Reading the file…';
    if (!window.Papa){ msg.className='status-msg err'; msg.textContent='The file reader didn’t load. Refresh the page and try again.'; return; }
    Papa.parse(file, { header:true, skipEmptyLines:true, complete: res=>{
      const fields = res.meta.fields || [];
      const isGR = fields.includes('Title') && fields.includes('Exclusive Shelf');
      const isSG = fields.includes('Title') && fields.includes('Read Status');
      if (!isGR && !isSG){
        msg.className='status-msg err'; msg.textContent='That doesn’t look like a Goodreads or StoryGraph export. Choose the .csv file you downloaded from one of them.'; return;
      }
      source = isGR ? 'Goodreads' : 'StoryGraph';
      const rows = res.data.map(r=>grRow(isGR ? r : sgToGr(r))).filter(Boolean);
      if (!rows.length){ msg.className='status-msg err'; msg.textContent='No books were found in that file.'; return; }
      review(rows);
    }, error: ()=>{ msg.className='status-msg err'; msg.textContent='Couldn’t read that file. Make sure it’s the .csv file from Goodreads.'; } });
  }
  function review(rows){
    const key = b => b.isbn || (b.title.toLowerCase()+'|'+(b.author||'').toLowerCase());
    const have = new Set(S.books.flatMap(b=>[b.isbn, b.title.toLowerCase().trim()+'|'+(b.author||'').toLowerCase().trim()].filter(Boolean)));
    const isDupe = b => (b.isbn && have.has(b.isbn)) || have.has(b.title.toLowerCase()+'|'+(b.author||'').toLowerCase());
    const shelves = [...new Set(rows.map(r=>r.shelf))].sort((a,b)=>(GR_SHELVES[a]?0:1)-(GR_SHELVES[b]?0:1) || a.localeCompare(b));
    const picked = new Set(shelves);
    const ownedCount = rows.filter(r=>r.owned).length;
    let ownedOnly = false, withReviews = true;
    const summary = h('p',{class:'import-sum'});
    const go = h('button',{class:'btn primary'});
    const chosen = () => { const seen = new Set(); return rows.filter(r=>picked.has(r.shelf) && (!ownedOnly || r.owned) && !isDupe(r) && !seen.has(key(r)) && seen.add(key(r))); };
    const shelfBox = h('div',{class:'checks'}, shelves.map(sh=>{
      const n = rows.filter(r=>r.shelf===sh).length;
      const cb = h('input',{type:'checkbox',checked:true,onchange:e=>{ e.target.checked ? picked.add(sh) : picked.delete(sh); update(); }});
      return h('label',{class:'check'}, cb, ` ${GR_SHELVES[sh] || sh.replace(/-/g,' ')} `, h('span',{class:'small',text:`(${n})`}),
        !GR_SHELVES[sh] ? h('span',{class:'small',text:` → ${STATUS[grStatus(sh)]}`}) : null);
    }));
    const ownedBox = ownedCount ? h('label',{class:'check'}, h('input',{type:'checkbox',onchange:e=>{ ownedOnly = e.target.checked; update(); }}),
      ` Only books ${source} lists as owned `, h('span',{class:'small',text:`(${ownedCount})`})) : null;
    const revBox = h('label',{class:'check'}, h('input',{type:'checkbox',checked:true,onchange:e=>{ withReviews = e.target.checked; update(); }}),
      ' Include my ratings and reviews ', h('span',{class:'small',text:'(shared with friends, like other reviews)'}));
    function update(){
      const list = chosen(), dupes = rows.filter(r=>picked.has(r.shelf) && (!ownedOnly || r.owned) && isDupe(r)).length;
      summary.textContent = `${list.length} book${list.length===1?'':'s'} will be added.` + (dupes ? ` ${dupes} already in your library will be skipped.` : '');
      go.textContent = list.length ? `Import ${list.length} book${list.length===1?'':'s'}` : 'Nothing to import';
      go.disabled = !list.length;
    }
    go.onclick = async () => {
      const list = chosen(); go.disabled = true;
      const out = list.map(r=>({ title:r.title, author:r.author, isbn:r.isbn, year:r.year, pages:r.pages, cover_url:r.cover_url,
        status:r.status, rating: withReviews ? r.rating : 0, review: withReviews ? r.review : '',
        reviewed_at: withReviews && (r.review || r.rating) ? (r.read_at || r.added_at) : null,
        ...(r.added_at ? {added_at:r.added_at} : {}) }));
      let done = 0;
      try{
        for (let i=0; i<out.length; i+=100){
          go.textContent = `Importing… ${done} of ${out.length}`;
          await run(sb.from('user_books').insert(out.slice(i,i+100)), 'The import stopped partway. Books added so far are saved. Choose the file again to add the rest.');
          done += Math.min(100, out.length-i);
        }
        closeSheet(); toast(`Imported ${done} book${done===1?'':'s'} from ${source}`); S.view='library'; S.filter='all'; loadAll();
      }catch{ go.textContent = `Stopped after ${done} of ${out.length}`; loadAll(); }
    };
    update();
    body.replaceChildren(...[
      h('p',{style:'margin-top:0'}, `Found ${rows.length} book${rows.length===1?'':'s'} in your ${source} export. Shelfmark is for books you own, so uncheck any of these you don’t have.`),
      h('span',{class:'lbl'}, source==='Goodreads' ? 'Goodreads shelves' : 'StoryGraph reading status'), shelfBox, ownedBox,
      h('div',{class:'section'}, revBox),
      h('div',{class:'section'}, summary, h('div',{class:'row'}, go, h('button',{class:'btn ghost',onclick:start},'Choose a different file')))
    ].filter(Boolean));
  }
  start();
  openSheet('Import your library', body);
}

async function lookupIsbn(isbn){
  try{
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const d = (await r.json())['ISBN:'+isbn];
    if (d && d.title) return { title:d.title, author:(d.authors||[]).map(a=>a.name).slice(0,3).join(', '), year:parseYear(d.publish_date),
      pages:d.number_of_pages||null, isbn, cover_url:(d.cover && (d.cover.medium || d.cover.large)) || null };
  }catch{}
  try{
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const it = ((await r.json()).items||[])[0];
    if (it && it.volumeInfo && it.volumeInfo.title){ const v = it.volumeInfo;
      return { title:v.title, author:(v.authors||[]).slice(0,3).join(', '), year:parseYear(v.publishedDate), pages:v.pageCount||null, isbn,
        cover_url: v.imageLinks && v.imageLinks.thumbnail ? v.imageLinks.thumbnail.replace(/^http:/,'https:') : null };
    }
  }catch{}
  return null;
}
async function searchBooks(q, signal){
  const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median`;
  const r = await fetch(url, {signal}); if (!r.ok) throw new Error('search failed');
  const j = await r.json();
  return (j.docs||[]).filter(d=>d.title).map(d=>({ title:d.title, author:(d.author_name||[]).slice(0,2).join(', '), year:d.first_publish_year||null,
    pages:d.number_of_pages_median||null, isbn:(d.isbn||[]).find(x=>/^97[89]\d{10}$/.test(x)) || null,
    cover_url: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : null }));
}

/* Barcode reading */
let stream = null, scanTimer = null, zx = null, bd = null;
function stopCamera(){ clearInterval(scanTimer); scanTimer=null; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
function zxDecode(canvas){
  if (!window.ZXing) return null;
  try{
    if (!zx){ zx = new ZXing.MultiFormatReader(); const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER,true); zx.setHints(hints); }
    return zx.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)))).getText();
  }catch{ return null; }
}
async function decodeCanvas(canvas){
  if ('BarcodeDetector' in window){
    try{ bd = bd || new BarcodeDetector({formats:['ean_13','ean_8','upc_a']}); const r = await bd.detect(canvas); if (r.length) return r[0].rawValue; }catch{}
  }
  return zxDecode(canvas);
}
async function decodeFile(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    for (const max of [1400,900,2000]) for (const rot of [0,90]){
      const s = Math.min(1, max/Math.max(img.width,img.height)), w=Math.round(img.width*s), hh=Math.round(img.height*s);
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      if (rot){ c.width=hh; c.height=w; ctx.translate(hh/2,w/2); ctx.rotate(Math.PI/2); ctx.drawImage(img,-w/2,-hh/2,w,hh); }
      else { c.width=w; c.height=hh; ctx.drawImage(img,0,0,w,hh); }
      const code = await decodeCanvas(c); if (code) return code;
    }
    return null;
  }catch{ return null; } finally{ URL.revokeObjectURL(url); }
}

function openAdd(tab='scan'){
  const panel = h('div');
  const tabs = h('div',{class:'seg',role:'tablist',style:'margin-bottom:18px'});
  const drawTabs = cur => tabs.replaceChildren(...[['scan','Scan barcode'],['search','Search'],['manual','Enter manually']]
    .map(([k,l])=>h('button',{role:'tab','aria-selected':cur===k,onclick:()=>show(k)},l)));
  function show(k){ stopCamera(); drawTabs(k); panel.replaceChildren(k==='scan'?scanPanel(): k==='search'?searchPanel():bookForm({}, 'Add to library', addBook)); }
  openSheet('Add a book', h('div',{},tabs,panel,
    h('p',{class:'small',style:'margin:22px 0 0;text-align:center'}, h('button',{class:'linkish',onclick:openImport},'Import from Goodreads or StoryGraph instead'))), stopCamera);
  show(tab);

  function confirmPanel(data, note){
    stopCamera();
    panel.replaceChildren(...[note ? h('p',{class:'status-msg',text:note}) : null, bookForm(data, 'Add to library', addBook),
      h('button',{class:'btn ghost',style:'margin-top:8px',onclick:()=>show('scan')},'Scan a different book')].filter(Boolean));
  }
  async function handleIsbn(raw, msg){
    const isbn = normalizeIsbn(raw);
    if (!isbn){
      msg.className='status-msg err';
      msg.textContent = /^\d{12}$/.test(String(raw)) ? 'That’s a store barcode, not an ISBN. Look for the barcode labeled ISBN, usually on the back cover.' : "That isn't a valid ISBN. Check the number and try again.";
      return;
    }
    stopCamera(); msg.className='status-msg'; msg.textContent=`Found ISBN ${isbn}. Looking up the book…`;
    const b = await lookupIsbn(isbn);
    if (b) confirmPanel(b, 'Check these details before adding.');
    else confirmPanel({isbn}, `We couldn't find ISBN ${isbn} in the book catalogs. Enter the title and author to add it.`);
  }

  function scanPanel(){
    const msg = h('p',{class:'status-msg',text:'Point your camera at the barcode on the back of the book.'});
    const video = h('video',{playsinline:true,muted:true,autoplay:true});
    const box = h('div',{class:'scan-box hidden'}, video, h('div',{class:'aim'}));
    const canvas = document.createElement('canvas');
    const startBtn = h('button',{class:'btn primary',onclick:startCam},'Start camera');
    async function startCam(){
      startBtn.disabled = true;
      try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}); }
      catch{ startBtn.disabled=false; msg.className='status-msg err'; msg.textContent='Couldn’t open the camera. Allow camera access for this site, or use “Photo of the barcode” instead.'; return; }
      video.srcObject = stream; box.classList.remove('hidden'); startBtn.classList.add('hidden');
      try{ await video.play(); }catch{}
      msg.className='status-msg'; msg.textContent='Hold the barcode inside the frame…';
      let busy = false;
      scanTimer = setInterval(async ()=>{
        if (busy || !video.videoWidth) return; busy = true;
        const w = Math.min(960, video.videoWidth), hh = Math.round(video.videoHeight*w/video.videoWidth);
        canvas.width=w; canvas.height=hh; canvas.getContext('2d').drawImage(video,0,0,w,hh);
        const code = await decodeCanvas(canvas); busy = false;
        if (code && scanTimer){ if (navigator.vibrate) navigator.vibrate(60); stopCamera(); box.classList.add('hidden'); handleIsbn(code, msg); }
      }, 300);
    }
    const photoIn = h('input',{type:'file',accept:'image/*',capture:'environment',class:'hidden',onchange:async e=>{
      const file = e.target.files[0]; e.target.value=''; if(!file) return;
      msg.className='status-msg'; msg.textContent='Reading the barcode…';
      const code = await decodeFile(file);
      if (code) handleIsbn(code, msg);
      else { msg.className='status-msg err'; msg.textContent="Couldn't read a barcode in that photo. Get closer, keep it flat and well lit, and try again."; }
    }});
    const isbnIn = h('input',{class:'field',inputmode:'numeric',placeholder:'e.g. 978-0-14-311760-2','aria-label':'ISBN'});
    return h('div',{}, box, msg,
      h('div',{class:'row'}, startBtn, h('button',{class:'btn',onclick:()=>photoIn.click()},'Photo of the barcode'), photoIn),
      h('div',{class:'divider'},'or type the ISBN'),
      h('form',{class:'row',onsubmit:e=>{ e.preventDefault(); handleIsbn(isbnIn.value, msg); }},
        h('div',{style:'flex:1;min-width:180px'},isbnIn), h('button',{class:'btn',type:'submit'},'Look up')));
  }

  function searchPanel(){
    const input = h('input',{class:'field',type:'search',placeholder:'Title, author, or both','aria-label':'Search for a book'});
    const msg = h('p',{class:'status-msg'}), results = h('div',{class:'results'});
    let ctl = null;
    const form = h('form',{class:'row',onsubmit:async e=>{
      e.preventDefault(); const q = input.value.trim(); if(!q) return;
      if (ctl) ctl.abort(); ctl = new AbortController();
      results.replaceChildren(); msg.className='status-msg'; msg.textContent='Searching…';
      try{
        const list = await searchBooks(q, ctl.signal);
        msg.textContent = list.length ? 'Pick your book. You can edit the details before adding.' : 'No matches. Try different words, or enter it manually.';
        results.replaceChildren(...list.map(r=>h('div',{class:'result'}, coverEl(r,'mini'),
          h('div',{class:'info'}, h('b',{text:r.title}), h('span',{text:[r.author,r.year].filter(Boolean).join(', ')})),
          h('button',{class:'btn',onclick:()=>confirmPanel(r,'Check these details before adding. The ISBN may be a different edition from yours.')},'Choose'))));
      }catch(err){ if (err.name!=='AbortError'){ msg.className='status-msg err'; msg.textContent="The search didn't work. Check your connection and try again."; } }
    }}, h('div',{style:'flex:1;min-width:180px'},input), h('button',{class:'btn primary',type:'submit'},'Search'));
    return h('div',{}, form, msg, results);
  }
}

let currentUserId = null, firstAuth = true;
sb.auth.onAuthStateChange((_event, session) => {
  const user = session ? session.user : null;
  const changed = firstAuth || (user && user.id) !== currentUserId;
  firstAuth = false;
  S.user = user; currentUserId = user && user.id;
  if (!changed) return;
  setTimeout(() => {
    Object.assign(S, { books:[], contacts:[], friendships:[], profiles:{}, borrowed:[], requests:[], shelfCounts:{}, loaded:false, view:'library', filter:'all', q:'', holder:'', friend:null });
    render();
    if (user) loadAll();
  }, 0);
});
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && S.user && !$('#backdrop')){ loadAll(); if (S.view==='friend') loadFriendBooks(); } });
</script>
